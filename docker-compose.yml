# PostgreSQL NO se despliega aquí: vive en una VM dedicada (ver DB_HOST en backend/.env).
# La configuración de Laravel se lee de backend/.env (montado en el volumen); no usar env_file,
# porque las variables del contenedor tendrían prioridad sobre phpunit.xml y .env.
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      - redis

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

volumes:
  backend_vendor:
  frontend_node_modules:
  redis_data:
