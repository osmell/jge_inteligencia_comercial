# PostgreSQL NO se despliega aquí: vive en una VM dedicada (ver DB_HOST en backend/.env).
# La configuración de Laravel se lee de backend/.env (montado en el volumen); no usar env_file,
# porque las variables del contenedor tendrían prioridad sobre phpunit.xml y .env.
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      - redis

  # Worker de colas (importaciones y trabajos largos). Misma imagen que el backend.
  queue:
    build: ./backend
    # Las importaciones grandes (hasta 200 000 filas) necesitan más memoria que el límite por defecto de PHP.
    command: ["php", "-d", "memory_limit=1G", "artisan", "queue:work", "--tries=1", "--timeout=3600", "--sleep=2", "--memory=900"]
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      - redis

  # Servidor de tiempo real (WebSockets, Laravel Reverb): el navegador se conecta al puerto 8080; la autorización de cada canal la hace el backend.
  reverb:
    build: ./backend
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      - redis

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      # Documento de la API generado por el backend: de él salen los tipos de TypeScript (npm run api:types).
      - ./backend/openapi.json:/api-spec/openapi.json:ro
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

volumes:
  backend_vendor:
  frontend_node_modules:
  redis_data:
