# Solo desarrollo local: PostgreSQL de reemplazo mientras no se use la VM dedicada.
# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# En producción NO se usa; DB_HOST apunta a la VM.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: jge
      POSTGRES_USER: jge
      POSTGRES_PASSWORD: jge_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql

  backend:
    depends_on:
      - postgres

volumes:
  postgres_dev_data:
