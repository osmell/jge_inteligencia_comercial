version: 2
updates:
  - package-ecosystem: composer
    directory: /backend
    schedule: { interval: monthly }
    groups:
      composer: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: monthly }
    groups:
      npm: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
